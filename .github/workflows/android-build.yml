name: Android Build AAR
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 全局声明启用 Node.js 24 运行时，消除依赖组件的兼容性警告与中断
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5  # 升级至 v5 版本
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4  # 升级至 v4 版本

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build Bcore release AAR
        run: ./gradlew :Bcore:assembleRelease

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: Bcore_AAR
          path: Bcore/build/outputs/aar/*.aar
